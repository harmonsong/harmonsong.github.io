- title: Research Experience
  type: time_table
  contents:
    - title: Enhancing the Applicability of the F-J Method for Fault Zone Subsurface Tomography
      institution: Individual Project under the supervision of Prof. Xiaofei CHEN
      year: 2023 - 2024
      description:
        - Developed an innovative partitioning strategy to improve surface wave tomography (SWT) for complex subsurface structures.
        - Proposed a dispersion similarity-based partitioning strategy to resolve bifurcation without increasing manual workload.
        - Achieved high-resolution imaging of the surveyed fault system's subsurface structure using the modified F-J method.

    - title: Exploration of Non-linear Cross-correlation Stacking Methods for the F-J Method
      institution: Individual Project under Prof. Xiaofei CHEN and Dr. Zhengbo LI
      year: 2021 - 2023
      description:
        - Investigated the impact of various non-linear cross-correlation stacking methods on F-J surface wave tomography.
        - Incorporated stacking methods into a Python package for the F-J method.
        - Applied the methods to USArray data, finding FPS significantly improves dispersion curve quality.

    - title: Numerical Simulation of Fluid Waves in Earth's Outer Core
      institution: Undergraduate Research Project under Prof. Yufeng LIN
      year: 2020 - 2022
      description:
        - Simulated Magnetic-Archimedes-Coriolis (MAC) waves to model fluid dynamics in Earth's outer core.
        - Developed Matlab code for numerical solutions and performed simulations on a supercomputer.
        - Identified similar patterns in eigenmodes by comparing simulation results with satellite geomagnetic data (CHAOS-7).

